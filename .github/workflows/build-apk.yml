name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q "EcuPinExtractor-Android-Kotlin (1).zip" -d source

      - name: Find Gradle project
        run: |
          find source -name gradlew -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name gradlew -type f | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcuPinExtractor-Debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
