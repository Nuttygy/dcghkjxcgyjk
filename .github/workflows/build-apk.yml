name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Android source
        run: |
          mkdir -p source
          unzip -q "EcuPinExtractor-Android-Kotlin (1).zip" -d source

      - name: Check project
        run: |
          echo "Project files:"
          find source/EcuPinExtractor -maxdepth 3 -type f | sort

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Fix root Gradle build file
        working-directory: source/EcuPinExtractor
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

      - name: Build Debug APK
        working-directory: source/EcuPinExtractor
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Show generated APK
        run: |
          find source/EcuPinExtractor -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcuPinExtractor-Debug-APK
          path: source/EcuPinExtractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
