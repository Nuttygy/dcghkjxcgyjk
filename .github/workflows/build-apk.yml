name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Android source
        run: |
          mkdir -p source
          unzip -q "EcuPinExtractor-Android-Kotlin (1).zip" -d source

      - name: Check project
        run: |
          echo "Project files:"
          find source/EcuPinExtractor -maxdepth 4 -type f | sort

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Fix root Gradle build file
        working-directory: source/EcuPinExtractor
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

      - name: Create missing Android resources
        working-directory: source/EcuPinExtractor
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > app/src/main/res/xml/backup_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
          </full-backup-content>
          EOF

          cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
              </cloud-backup>
              <device-transfer>
              </device-transfer>
          </data-extraction-rules>
          EOF

          python3 - <<'PY'
          import struct
          import zlib

          def png(path):
              raw = b'\x00\x00\x00\x00'

              def chunk(t, d):
                  return (
                      struct.pack(">I", len(d))
                      + t
                      + d
                      + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
                  )

              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(
                  b'IHDR',
                  struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
              )
              data += chunk(b'IDAT', zlib.compress(raw))
              data += chunk(b'IEND', b'')

              with open(path, 'wb') as f:
                  f.write(data)

          for density in ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"]:
              png(f"app/src/main/res/mipmap-{density}/ic_launcher.png")
              png(f"app/src/main/res/mipmap-{density}/ic_launcher_round.png")
          PY

      - name: Build Debug APK
        working-directory: source/EcuPinExtractor
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Show generated APK
        run: |
          find source/EcuPinExtractor -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcuPinExtractor-Debug-APK
          path: source/EcuPinExtractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
